{% extends "base.html" %}
{% block title %}Connexion - TrustSolve{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Bienvenue ! Veuillez renseigner vos identifiants.</p>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" class="form-control" name="matricule" placeholder="Numéro matricule" required>
                    <span class="input-icon">🪪</span>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" class="form-control" name="password" placeholder="Mot de passe (6 chiffres)" required>
                    <span class="input-icon">🔒</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <div class="auth-footer">
            <p>Pas encore inscrit ? <a href="/register">Créer un compte</a></p>
        </div>
    </div>
</div>
{% endblock %}
